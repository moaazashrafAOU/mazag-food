<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4e4b1">
  <meta name="description" content="مزاج — سويها بمزاج. كل الروابط في مكان واحد.">
  <title>مزاج | الروابط</title>
  <style>
    :root{
      --bg:#f4e4b1;
      --bg2:#fff8e6;
      --primary:#cf252b;
      --primary-dark:#a81c24;
      --text:#40261e;
      --muted:#7d6056;
      --wa:#25D366;
      --wa-dark:#1ea855;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Tahoma, Arial, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(207,37,43,.12) 0 70px, transparent 71px),
        radial-gradient(circle at bottom right, rgba(207,37,43,.10) 0 110px, transparent 111px),
        linear-gradient(160deg, var(--bg), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px;
    }
    .wrap{
      width:100%;
      max-width:460px;
    }
    .card{
      background:rgba(255,255,255,.42);
      border:1px solid rgba(207,37,43,.14);
      backdrop-filter: blur(5px);
      border-radius:28px;
      padding:26px 20px 22px;
      box-shadow:0 20px 60px rgba(82,46,22,.10);
      text-align:center;
    }
    .logo{
      width:min(270px,82%);
      display:block;
      margin:0 auto 12px;
      height:auto;
    }
    .title{
      margin:6px 0 2px;
      color:var(--primary);
      font-size:29px;
      font-weight:800;
    }
    .subtitle{
      margin:0 0 22px;
      color:var(--muted);
      font-size:15px;
      font-weight:600;
    }
    .links{
      display:grid;
      gap:12px;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:58px;
      padding:14px 18px;
      text-decoration:none;
      color:#fff;
      background:var(--primary);
      border:1px solid var(--primary);
      border-radius:18px;
      font-size:17px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(207,37,43,.16);
      transition:transform .18s ease, background .18s ease;
    }
    .btn:hover{
      transform:translateY(-2px);
      background:var(--primary-dark);
    }
    .btn.whatsapp{
      background:var(--wa);
      border-color:var(--wa);
      box-shadow:0 8px 20px rgba(37,211,102,.18);
    }
    .btn.whatsapp:hover{
      background:var(--wa-dark);
    }
    .footer{
      margin-top:18px;
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
    }
    @media (max-width:380px){
      .card{padding:22px 16px 18px}
      .title{font-size:25px}
      .btn{font-size:16px}
    }
  </style>
</head>
